        // Arithmetic stays exact, including decimal and fractional coefficients.
        function fraction(n, d = 1n) {
            if (d === 0n) throw Error('Denominador cero');
            let a = n < 0n ? -n : n;
            let b = d < 0n ? -d : d;
            while (b) [a, b] = [b, a % b];
            if (d < 0n) a = -a;
            return [n / a, d / a];
        }

        function parseAnswer(text) {
            if (!text.trim() || text.length > 220) throw Error('Longitud');
            const superscripts = '⁰¹²³⁴⁵⁶⁷⁸⁹';
            const source = text.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, s => '^' + [...s].map(c => superscripts.indexOf(c)).join(''))
                .replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/÷|:/g, '/').replace(/,/g, '.');
            const tokens = source.match(/\d+(?:\.\d+)?|[a-z]|[^\s]/g) || [];
            let pos = 0;
            function atom() {
                const t = tokens[pos++];
                if (t === '(') {
                    const node = sum();
                    if (tokens[pos++] !== ')') throw Error('Paréntesis');
                    return node;
                }
                if (/^[abcdxyz]$/.test(t || '')) return {op:'letter', t};
                if (!/^\d+(?:\.\d+)?$/.test(t || '') || t.length > 24) throw Error('Número');
                const decimals = (t.split('.')[1] || '').length;
                return {op:'number', value:fraction(BigInt(t.replace('.', '')), 10n ** BigInt(decimals))};
            }
            function signed() {
                if (tokens[pos] === '+' || tokens[pos] === '-') {
                    const sign = tokens[pos++];
                    const child = signed();
                    return sign === '-' ? {op:'neg', child} : child;
                }
                let node = atom();
                if (tokens[pos] === '^') {
                    pos++;
                    const exp = tokens[pos++];
                    if (!/^\d{1,2}$/.test(exp || '') || Number(exp) > 12) throw Error('Exponente');
                    node = {op:'power', child:node, exponent:Number(exp)};
                }
                return node;
            }
            function product() {
                let node = signed();
                while (pos < tokens.length) {
                    let op = tokens[pos];
                    if (op === '*' || op === '/') pos++;
                    else if (/^[abcdxyz(]$/.test(op)) op = '*';
                    else break;
                    node = {op, left:node, right:signed()};
                }
                return node;
            }
            function sum() {
                let node = product();
                while (tokens[pos] === '+' || tokens[pos] === '-') {
                    const op = tokens[pos++];
                    node = {op, left:node, right:product()};
                }
                return node;
            }
            const root = sum();
            if (pos !== tokens.length) throw Error('Expresión incompleta');
            return root;
        }

        // Keep sums as factors: a developed polynomial and its factorization
        // have different signatures. Normalize scalar multiples and factor order.
        function signature(node) {
            const scalar = (coef, factors = []) => ({coef, factors});
            function combine(a, b, divide = false) {
                const [n, d] = b.coef;
                if (divide && b.factors.length) throw Error('Denominador literal');
                const coef = fraction(a.coef[0] * (divide ? d : n), a.coef[1] * (divide ? n : d));
                if (a.factors.length + b.factors.length > 64) throw Error('Demasiados factores');
                return scalar(coef, [...a.factors, ...b.factors].sort());
            }
            function visit(n) {
                if (n.op === 'number') return scalar(n.value);
                if (n.op === 'letter') return scalar([1n,1n], [n.t]);
                if (n.op === 'neg') return combine(scalar([-1n,1n]), visit(n.child));
                if (n.op === '*' || n.op === '/') return combine(visit(n.left), visit(n.right), n.op === '/');
                if (n.op === 'power') {
                    if (n.exponent < 1) throw Error('Potencia sin reducir');
                    const base = visit(n.child);
                    if (base.coef.some(v => v.toString().length * n.exponent > 120)) throw Error('Potencia demasiado grande');
                    let result = scalar([1n,1n]);
                    for (let i = 0; i < n.exponent; i++) result = combine(result, base);
                    return result;
                }
                const terms = new Map();
                function collect(t, sign) {
                    if (t.op === 'neg') return collect(t.child, -sign);
                    if (t.op === '+' || t.op === '-') {
                        collect(t.left, sign);
                        collect(t.right, t.op === '+' ? sign : -sign);
                    } else {
                        const term = visit(t);
                        const key = JSON.stringify(term.factors);
                        if (terms.has(key) || !term.coef[0]) throw Error('Términos sin reducir');
                        terms.set(key, [sign * term.coef[0], term.coef[1]]);
                    }
                }
                collect(n, 1n);
                const keys = [...terms.keys()].sort();
                const lead = terms.get(keys[0]);
                const normalized = keys.map(key => {
                    const [a,b] = terms.get(key);
                    return [key, fraction(a * lead[1], b * lead[0]).join('/')];
                });
                return scalar(lead, [JSON.stringify(normalized)]);
            }
            const value = visit(node);
            return JSON.stringify([value.coef.join('/'), value.factors]);
        }

        function correctAnswer(input, expected) {
            try {
                const pupil = parseAnswer(input);
                const model = parseAnswer(expected);
                if (signature(pupil) !== signature(model)) return false;
                // A development must have its terms outside the parentheses.
                const unwrap = n => n.op === 'neg' ? unwrap(n.child) : n;
                if (['+', '-'].includes(model.op) && !['+', '-'].includes(unwrap(pupil).op)) return false;
                if (!expected.includes('(')) {
                    // In a finished monomial each variable occurs once and the
                    // coefficient may be written before, after or as a fraction.
                    function reducedTerm(root) {
                        const letters = new Set();
                        let numerators = 0, denominators = 0;
                        function part(n, denominator = false) {
                            if (n.op === 'neg') return part(n.child, denominator);
                            if (n.op === '*') return part(n.left, denominator) && part(n.right, denominator);
                            if (n.op === '/') return part(n.left, denominator) && part(n.right, !denominator);
                            if (n.op === 'number') return denominator ? ++denominators <= 1 : ++numerators <= 1;
                            if (n.op === 'power') n = n.child;
                            if (denominator || n.op !== 'letter' || letters.has(n.t)) return false;
                            letters.add(n.t);
                            return true;
                        }
                        return part(root);
                    }
                    function reduced(n) {
                        if (n.op === 'neg') return reduced(n.child);
                        if (n.op === '+' || n.op === '-') return reduced(n.left) && reduced(n.right);
                        return reducedTerm(n);
                    }
                    if (!reduced(pupil)) return false;
                }
                return true;
            } catch {
                return false;
            }
        }

                byBlock[blockId].correct += stats.correct;

            const percentage = totalExercises > 0 ? ((totalCorrect / totalExercises) * 100).toFixed(1) : 0;

        function renderFractions(text) {
            const MARKER = '§§§FRAC';
            let result = text;
            let fractionCounter = 0;
            const fractions = [];
            
            result = result.replace(/([0-9a-z²³⁴⁵⁶⁷⁸⁹]+)\/([0-9]+)/gi, (match, numerator, denominator) => {
                const html = `<span class="frac"><span class="top">${numerator}</span><span class="bottom">${denominator}</span></span>`;
                fractions.push(html);
                return `${MARKER}${fractionCounter++}§§§`;
            });
            
            fractions.forEach((html, index) => {
                result = result.replace(`${MARKER}${index}§§§`, html);
            });
            
            return result;
        }

                            </div>
                            <div class="flex gap-2 flex-wrap">
                                ${(state.selectedBlock || state.selectedLevel) ? '<button onclick="goHome()" class="bg-white text-indigo-600 px-4 py-2 rounded-xl hover:bg-indigo-50 transition shadow-lg font-medium">🏠 Inicio</button>' : ''}
                                <button onclick="showResetModal()" class="bg-orange-500 text-white px-4 py-2 rounded-xl hover:bg-orange-600 transition shadow-lg font-medium">🔄 Reiniciar</button>
                                <button onclick="showReport()" class="bg-white text-indigo-600 px-4 py-2 rounded-xl hover:bg-indigo-50 transition shadow-lg font-medium">📊 Informe</button>
                            </div>
                        </div>
                        <div class="flex gap-4 mt-6 flex-wrap">
                            <div class="bg-white bg-opacity-20 px-4 py-2 rounded-lg backdrop-blur"><span class="font-semibold">⏱️ ${report.timeSpent} min</span></div>
                            ${report.totalExercises > 0 ? `<div class="bg-green-500 bg-opacity-90 px-4 py-2 rounded-lg backdrop-blur"><span class="font-semibold">✅ ${report.totalCorrect}/${report.totalExercises}</span></div>
                            <div class="bg-yellow-400 bg-opacity-90 px-4 py-2 rounded-lg backdrop-blur"><span class="font-semibold text-gray-800">📊 ${report.percentage}% al primer intento · ${report.solved} resueltos</span></div>` : ''}
                        </div>
                    </div>
                    ${renderContent()}
                </div></div>`;
        }

        function renderContent() {
            if (!state.selectedBlock) return renderBlockSelection();
            else if (!state.selectedLevel) return renderLevelSelection();
            else return renderExercises();
        }

        function renderBlockSelection() {
            return `<div><h2 class="text-2xl font-bold text-gray-800 mb-6">🏆 Selecciona un Bloque Temático</h2>
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${Object.entries(blocks).map(([id, block]) => `<div onclick="selectBlock('${id}')" class="bg-gradient-to-br ${block.color} rounded-2xl shadow-xl p-6 cursor-pointer transform transition-all duration-300 hover:scale-105 text-white">
                        <div class="text-5xl mb-4">${block.icon}</div>
                        <h3 class="font-bold text-xl mb-1">${block.title}</h3>
                        <p class="text-white text-opacity-90 text-sm mb-4">${block.subtitle}</p>
                        <div class="flex items-center text-white font-medium">Comenzar →</div>
                    </div>`).join('')}
                </div></div>`;
        }

        function renderLevelSelection() {
            const block = blocks[state.selectedBlock];
            return `<div>
                <button onclick="backToBlocks()" class="mb-6 px-6 py-3 bg-white rounded-xl hover:bg-gray-50 transition shadow-lg">← Volver</button>
                <div class="bg-gradient-to-r ${block.color} rounded-2xl shadow-xl p-8 mb-8 text-white">
                    <h2 class="text-3xl font-bold">${block.title}</h2>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    ${Object.entries(levelNames[state.selectedBlock] || {}).map(([levelId, levelName]) => {
                        const statKey = state.selectedBlock + '-' + levelId;
                        const stats = state.statistics[statKey];
                        const hasStats = stats && stats.total > 0;
                        const pct = hasStats ? ((stats.correct / stats.total) * 100).toFixed(0) : 0;
                        return `<div onclick="selectLevel('${levelId}')" class="bg-white rounded-xl shadow-lg p-6 cursor-pointer hover:shadow-2xl transition-all">
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-green-500 text-white px-4 py-1 rounded-full text-sm font-bold">Nivel ${levelId}</span>
                                ${hasStats ? `<span class="text-sm font-bold text-green-600">${stats.correct}/${stats.total} al primer intento</span>` : ''}
                            </div>
                            <h3 class="font-bold text-xl text-gray-800 mb-2">${levelName}</h3>
                            ${hasStats ? `<div class="mt-2"><div class="w-full bg-gray-200 rounded-full h-2"><div class="h-2 rounded-full bg-green-500" style="width: ${pct}%"></div></div></div>` : ''}
                        </div>`;
                    }).join('')}
                </div></div>`;
        }

        function ruffini(root, coefficients) {
            const row = [coefficients[0]], products = [''];
            for (const c of coefficients.slice(1)) {
                const product = row[row.length - 1] * root;
                products.push(product);
                row.push(c + product);
            }
            const cells = values => values.map(v => `<td class="px-2 text-center">${v}</td>`).join('');
            return `<div class="overflow-x-auto my-2"><table class="border-collapse"><caption>Ruffini con ${root}</caption><tbody>
                <tr><th scope="row">Coeficientes</th>${cells(coefficients)}</tr>
                <tr><th scope="row">Productos por ${root}</th>${cells(products)}</tr>
                <tr class="border-t"><th scope="row">Resultado</th>${cells(row)}</tr></tbody></table></div>`;
        }

        function explanation(ex, level, index) {
            if (level !== '5.5' && !(level === '5.6' && index === 6)) return renderFractions(ex.sol);
            const intro = 'Baja el primer coeficiente. Multiplica el número que acabas de bajar u obtener por la raíz del divisor y suma el producto al coeficiente de la columna siguiente. El último valor es el resto.';
            if (level === '5.6') return intro + ruffini(-1,[1,2,-1,-2]) +
                'El resto es 0. Extraemos (x + 1) y seguimos con el cociente x² + x - 2.' +
                ruffini(-2,[1,1,-2]) + 'El resto vuelve a ser 0. Extraemos (x + 2) y el cociente es x - 1. El producto final es (x + 1)(x + 2)(x - 1).';
            const cases = [[2,[1,2,-5,-6]],[1,[1,-6,11,-6]],[-3,[2,3,-8,3]],[1,[1,0,0,0,-1]]];
            return intro + (index === 3 ? ' En x⁴ - 1 escribimos 0 en los lugares de x³, x² y x.' : '') + ruffini(...cases[index]) + ex.sol;
        }

        function renderExercises() {
            const exercises = exerciseData[`${state.selectedBlock}-${state.selectedLevel}`] || [];
            return `<div>
                <div class="flex gap-2 mb-6 flex-wrap">
                    <button onclick="backToLevels()" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50">← Niveles</button>
                    <button onclick="goHome()" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50">🏠 Inicio</button>
                </div>
                <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                    <h2 class="text-2xl font-bold text-indigo-900">Nivel ${state.selectedLevel}: ${levelNames[state.selectedBlock]?.[state.selectedLevel]}</h2>
                    <p class="text-gray-600 mt-2">${exercises.length} ejercicios</p>
                </div>
                <div class="space-y-6">
                    ${exercises.map((ex, idx) => {
                        const key = `${state.selectedBlock}-${state.selectedLevel}-${idx}`;
                        const saved = state.showResults[key];
                        const result = saved?.answer === state.answers[key] ? saved : null;
                        return `<div class="bg-white border-2 rounded-xl p-6">
                            <div class="flex items-start gap-4">
                                <span class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full font-bold">#${idx + 1}</span>
                                <div class="flex-1">
                                    <div class="text-xl font-medium mb-4">${renderFractions(ex.q)}</div>
                                    <div class="flex gap-2 flex-wrap">
                                        <input type="text" id="answer-${key}" value="${escapeHtml(state.answers[key] || '')}" oninput="this.setCustomValidity(''); updateAnswer('${key}', this.value)" placeholder="Tu respuesta" class="flex-1 min-w-[200px] px-4 py-3 border-2 rounded-lg focus:border-indigo-500 outline-none">
                                        <button onclick="checkAnswer('${key}', '${ex.a}')" class="px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">Comprobar</button>
                                    </div>
                                    ${result ? `<div id="feedback-${key}" class="mt-4 p-4 rounded-lg ${result.correct ? 'bg-green-50 border-2 border-green-300' : 'bg-red-50 border-2 border-red-300'}">
                                        <div class="flex items-center gap-2 mb-2">
                                            ${result.correct ? '<span class="text-2xl">✅</span><span class="font-bold text-green-800">¡Correcto! 🎉</span>' : '<span class="text-2xl">❌</span><span class="font-bold text-red-800">Incorrecto</span>'}
                                        </div>
                                        <div class="text-gray-700"><strong>Explicación:</strong> ${explanation(ex, state.selectedLevel, idx)}</div>
                                    </div>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div></div>`;
        }

        function renderReport(report) {
            return `<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                    <div class="text-center mb-6">
                        <div class="text-6xl mb-4">🏆</div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">Informe de Progreso</h2>
                        <p class="text-gray-600">Alumno: <strong>${escapeHtml(state.studentName)}</strong></p>
                    </div>
                    <div class="grid md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-blue-50 rounded-xl p-4 text-center">
                            <div class="text-3xl font-bold text-blue-600">${report.totalExercises}</div>
                            <div class="text-sm text-gray-600">Ejercicios realizados</div>
                        </div>
                        <div class="bg-green-50 rounded-xl p-4 text-center">
                            <div class="text-3xl font-bold text-green-600">${report.percentage}%</div>
                            <div class="text-sm text-gray-600">Acierto al primer intento (${report.totalCorrect}/${report.totalExercises})</div>
                        </div><div class="bg-indigo-50 rounded-xl p-4 text-center"><strong>${report.solved}</strong><div>Ejercicios resueltos</div>
                        </div>
                        <div class="bg-purple-50 rounded-xl p-4 text-center">
                            <div class="text-3xl font-bold text-purple-600">${report.timeSpent}</div>
                            <div class="text-sm text-gray-600">Minutos trabajados</div>
                        </div>
                    </div>
                    <div class="mb-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">Desglose por Bloques</h3>
                        ${Object.entries(report.byBlock).map(([blockId, data]) => {
                            const pct = data.total > 0 ? ((data.correct / data.total) * 100).toFixed(0) : 0;
                            return `<div class="mb-3">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="font-medium">${blocks[blockId]?.title}</span>
                                    <span class="text-sm text-gray-600">${data.correct}/${data.total} al primer intento (${pct}%) · ${data.solved} resueltos</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div class="h-3 rounded-full bg-gradient-to-r ${blocks[blockId]?.color}" style="width: ${pct}%"></div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="hideReport()" class="flex-1 min-w-[200px] px-6 py-3 bg-gray-200 rounded-xl hover:bg-gray-300 transition font-medium">Continuar</button>
                        <button onclick="goHome(); hideReport()" class="flex-1 min-w-[200px] px-6 py-3 bg-green-500 text-white rounded-xl hover:bg-green-600 transition font-medium">🏠 Inicio</button>
                        <button onclick="window.print()" class="flex-1 min-w-[200px] px-6 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition font-medium">🖨️ Imprimir</button>
                    </div>
                </div>
            </div>`;
        }

        function renderResetModal() {
            return `<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                    <div class="text-6xl text-center mb-4">🔄</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">¿Reiniciar Progreso?</h2>
                    <p class="text-gray-600 mb-6 text-center">Esto borrará todo tu progreso actual (ejercicios, estadísticas, nombre).</p>
                    <div class="flex gap-3">
                        <button onclick="hideResetModal()" class="flex-1 px-6 py-3 bg-gray-200 rounded-xl hover:bg-gray-300 transition font-medium">Cancelar</button>
                        <button onclick="resetProgress()" class="flex-1 px-6 py-3 bg-orange-500 text-white rounded-xl hover:bg-orange-600 transition font-medium">Reiniciar</button>
                    </div>
                </div>
            </div>`;
        }

        // Funciones globales
        window.setName = function() {
            const input = document.getElementById('nameInput');
            if (input && input.value.trim()) {
                state.studentName = input.value.trim();
                saveState();
                render();
            }
        };
        window.selectBlock = id => { state.selectedBlock = id; render(); };
        window.selectLevel = id => { state.selectedLevel = id; render(); };
        window.backToBlocks = () => { state.selectedBlock = null; state.selectedLevel = null; render(); };
        window.backToLevels = () => { state.selectedLevel = null; render(); };
        window.goHome = () => { state.selectedBlock = null; state.selectedLevel = null; render(); };
        window.updateAnswer = (key, value) => { state.answers[key] = value;
            localStorage.setItem('polyAnswers', JSON.stringify(state.answers));
            const feedback = document.getElementById('feedback-' + key);
            if (feedback) feedback.hidden = state.showResults[key]?.answer !== value;
        };
        window.checkAnswer = checkAnswer;
        window.showReport = () => { state.showReport = true; render(); };
        window.hideReport = () => { state.showReport = false; render(); };
        window.showResetModal = () => { state.showResetModal = true; render(); };
        window.hideResetModal = () => { state.showResetModal = false; render(); };
        window.resetProgress = () => {
            state.statistics = {}; 
            state.levelProgress = {}; 
            state.answers = {}; 
            state.showResults = {};
            state.selectedBlock = null; 
            state.selectedLevel = null; 
            state.showResetModal = false; 
            state.studentName = '';
            state.solved = {};
            for (const name of ['studentName','polyStatistics','polyProgress','polyAnswers','polySolved','polyResults']) localStorage.removeItem(name);
            render();
        };

        document.addEventListener('DOMContentLoaded', render);
        document.addEventListener('keypress', e => { 
            if (e.key === 'Enter' && document.getElementById('nameInput')) setName(); 
        });
    </script>
</body>
</html>
